# JVM sizing is deliberately modest.
#
# The previous values (-Xmx8G + 4G metaspace + 1G code cache for Gradle, plus
# a 4G Kotlin daemon) asked for roughly 17 GB of JVM allocation. On the 7.4 GB
# build machine that overcommits badly: the daemon is killed mid-build and the
# build fails with "Could not receive a message from the daemon" rather than a
# clean OutOfMemoryError, which makes it look like a Gradle fault instead of a
# memory one.
#
# Kotlin stays out of process. Running it in-process saves a JVM but loads the
# whole compiler into the Gradle daemon's metaspace, which then exhausts it —
# a separate daemon keeps that pressure isolated and is the cheaper trade here.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m

# No reusable daemon. A persistent daemon accumulates loaded classes across
# builds until metaspace is exhausted, which on this machine happens within a
# handful of builds. A fresh JVM per build costs startup time and removes that
# failure entirely.
org.gradle.daemon=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
