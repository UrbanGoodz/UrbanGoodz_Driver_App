# JVM sizing is deliberately modest — see driver_app/android/gradle.properties
# for the full reasoning. The previous -Xmx6G plus a 4G metaspace asked for
# roughly 11 GB on a 7.4 GB machine, which the OS answers by killing the
# daemon mid-build. That surfaces as "Could not receive a message from the
# daemon" and reads like a Gradle fault rather than a memory one.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m

# No reusable daemon. A persistent daemon accumulates loaded classes across
# builds until metaspace is exhausted.
org.gradle.daemon=false

org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
