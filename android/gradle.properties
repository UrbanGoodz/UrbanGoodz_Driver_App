# JVM sizing is deliberately modest — see driver_app/android/gradle.properties
# for the full reasoning. The previous -Xmx12G plus a 4G metaspace asked for
# roughly 16.5 GB on a 7.4 GB machine, which the OS answers by killing the
# daemon mid-build. That surfaces as "Could not receive a message from the
# daemon" and reads like a Gradle fault rather than a memory one.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m

# No reusable daemon. A persistent daemon accumulates loaded classes across
# builds until metaspace is exhausted.
org.gradle.daemon=false

android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=arm64_v8a_debug,armeabi_v7a_debug,x86_64_debug,arm64_v8a_release,armeabi_v7a_release,x86_64_release
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.jvm.target.validation.mode=warning
